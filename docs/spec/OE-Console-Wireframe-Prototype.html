<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OE Agency Intelligence Console — Interactive Wireframe (Low-Fi)</title>
<style>
  :root{--ink:#2b2b2b;--mut:#8a8a8a;--line:#d9d4cc;--bg:#faf8f4;--card:#ffffff;--amber:#b98a2e;--red:#a5432e;--green:#4e7a52;--acc:#3d5a4c;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}
  body{background:var(--bg);color:var(--ink);font-size:13px;line-height:1.5;}
  #app{display:flex;min-height:100vh;}
  aside{width:180px;border-right:1px solid var(--line);padding:14px 0;background:var(--card);flex-shrink:0;}
  aside .logo{font-weight:700;padding:0 16px 12px;border-bottom:1px solid var(--line);margin-bottom:10px;letter-spacing:.5px;}
  aside a{display:block;padding:7px 16px;color:var(--ink);text-decoration:none;border-left:3px solid transparent;}
  aside a.active{border-left-color:var(--acc);background:#f1ede6;font-weight:700;}
  aside a:hover{background:#f5f2ec;}
  main{flex:1;min-width:0;}
  .topbar{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap;}
  .topbar .search{flex:1;min-width:140px;border:1px dashed var(--line);padding:5px 10px;color:var(--mut);}
  select{padding:5px 8px;border:1px solid var(--line);background:#fff;font:inherit;}
  .content{padding:20px 22px;max-width:1080px;}
  h1{font-size:17px;margin-bottom:2px;} .crumb{color:var(--mut);font-size:11px;margin-bottom:14px;}
  .cards{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;}
  .card{background:var(--card);border:1px solid var(--line);padding:12px 14px;flex:1;min-width:200px;}
  .card h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin-bottom:6px;}
  .big{font-size:20px;font-weight:700;}
  table{width:100%;border-collapse:collapse;background:var(--card);margin:10px 0;}
  th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;}
  th{background:#f1ede6;font-size:11px;text-transform:uppercase;letter-spacing:.5px;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .bar{background:#eee;border:1px solid var(--line);height:12px;position:relative;min-width:90px;}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:#9aa89e;}
  .bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);}
  .amber{color:var(--amber);} .red{color:var(--red);} .green{color:var(--green);} .mut{color:var(--mut);}
  .masked{color:var(--mut);letter-spacing:2px;} .chip{display:inline-block;border:1px solid var(--line);padding:1px 8px;border-radius:10px;font-size:11px;margin:2px 3px 2px 0;background:#fff;cursor:pointer;}
  .note{border-left:3px solid var(--acc);background:#f1ede6;padding:8px 12px;margin:12px 0;font-size:12px;}
  .warn{border-left-color:var(--amber);} .risk{border-left-color:var(--red);}
  .btn{display:inline-block;border:1px solid var(--ink);background:#fff;padding:5px 12px;cursor:pointer;font:inherit;margin:4px 6px 4px 0;}
  .btn.primary{background:var(--ink);color:#fff;}
  .ring{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--acc) 0 81%, #e5e0d8 81% 100%);display:flex;align-items:center;justify-content:center;}
  .ring b{background:var(--card);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;}
  .row-entry{display:flex;gap:6px;align-items:center;margin:6px 0;flex-wrap:wrap;}
  .row-entry select,.row-entry .dur{border:1px solid var(--line);padding:4px 6px;background:#fff;}
  .flex{display:flex;gap:16px;flex-wrap:wrap;} .flex>div{flex:1;min-width:260px;}
  .ladder td{border:none;border-bottom:1px dashed var(--line);}
  .tag{font-size:10px;border:1px solid var(--line);padding:0 6px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);}
  .wf{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-top:26px;border-top:1px dashed var(--line);padding-top:8px;}
  @media(max-width:760px){aside{display:none}.mobiletabs{display:flex!important}}
  .mobiletabs{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);}
  .mobiletabs a{flex:1;text-align:center;padding:9px 0;color:var(--ink);text-decoration:none;font-size:11px;}
</style>
</head>

 <tr><td>forecast year-end</td><td class=num>+$41k</td><td class="mut">low +12k · high +78k</td></tr></table>
 <div class="note warn">⚑ Needs attention: Placemaking SP (forecast −2.5%) · Night Festival hours pacing · <a href="#" onclick="go('portfolio')">open portfolio →</a></div>
 <p class="mut">CAPACITY next 4 wks: 82% committed · PIPELINE $310k weighted · every figure drills to its inputs</p>
 <div class="wf">Wireframe F1 · one-page monthly account · calm language for a near-miss month</div>`;},

portfolio(){if(!can('s2'))return SCREENS.denied();
 return `<h1>Portfolio Profitability</h1><div class="crumb">Company › Portfolio · sort: profit per hour ▾</div>
 <table><tr><th>project</th><th class=num>fee</th><th class=num>actual cost</th><th class=num>GP</th><th class=num>GM</th><th class=num>$/int. hour</th><th>risk</th></tr>
 ${PROJECTS.map(p=>`<tr><td>${p.n}</td><td class=num>${money(p.fee)}</td><td class=num>${money(p.cost)}</td><td class=num class="${p.cls}">${money(p.gp)}</td><td class=num class="${p.cls}">${p.gm}</td><td class=num class="${p.cls}"><b>${p.ph}</b></td><td>${p.risk}</td></tr>`).join('')}</table>
 <div class="note risk">The $250k Placemaking project lost money; the $12k sprint earned $110 per hour. Third-party margin on Placemaking read 52% — only the full model shows the loss. <b>[Compare selected]</b></div>
 <div class="wf">Wireframe F2 · profit-per-hour as the equaliser · sortable table is the honest chart</div>`;},

reports(){return `<h1>Reports</h1><div class="crumb">Reports › Library</div>
 <p><span class="chip">Project profitability</span><span class="chip">Est vs actual hours</span><span class="chip">Company time allocation</span><span class="chip">Monthly summary</span>${can('s2')?'<span class="chip">Service-line analysis (R2)</span><span class="chip">Client profitability (R2)</span>':''}</p>
 <div class="card" style="max-width:560px"><h3>Company time allocation · Jul</h3>
 client work ▓▓▓▓▓▓▓▓▓▓ 58%<br>business dev ▓▓ 11%<br>admin ▓▓ 9%<br>training ▓ 4%<br>leave/PH ▓▓ 12%<br>unallocated ▓ 6% <span class="mut">— aggregate only, by design</span></div>
 <div class="wf">Wireframe · fixed reports R1 · builder R2 · no per-person productivity dimension exists</div>`;},

admin(){return `<h1>Administration</h1><div class="crumb">Admin</div>
 <p><span class="chip">Project templates (4)</span><span class="chip">Activity categories · flags</span><span class="chip">Time rules</span><span class="chip">Financial settings · GST 9%</span><span class="chip">Financial periods · Jun locked 🔒</span><span class="chip">Permissions</span><span class="chip">Audit log</span></p>
 <div class="note">June is closed — entries there are preserved as they were. Corrections flow as dated adjustments in July.</div>
 <div class="wf">Wireframe · admin area · locking + audit surface</div>`;},

denied(){return `<h1>—</h1><div class="note">This area isn't part of your access. If it should be, Ryan or the ops team can grant it.</div>`;},
more(){return SCREENS.insights();}
};

function nav(){const el=document.getElementById('nav');
 el.innerHTML=`<div class="logo">◐ OE CONSOLE</div>`+NAV[S.role].map(([k,l])=>`<a href="#" class="${S.screen===k?'active':''}" onclick="go('${k}');return false">${l}</a>`).join('')
 +`<div style="padding:12px 16px;color:var(--mut);font-size:11px;border-top:1px solid var(--line);margin-top:10px">Your time, your data.<br><u>Who sees what →</u></div>`;}
function go(s){S.screen=SCREENS[s]?s:'home';render();}
function setRole(r){S.role=r;const allowed=NAV[r].map(x=>x[0]);if(!allowed.includes(S.screen))S.screen='home';render();}
function render(){nav();document.getElementById('screen').innerHTML=SCREENS[S.screen]();}
render();
</script>
</body>
</html>
